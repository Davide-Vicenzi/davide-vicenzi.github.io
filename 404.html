<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagina non trovata — Davide Vicenzi</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="theme-color" content="#0E3F35">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--primary:#0E3F35;--accent:#B4823C;--bg:#F6F5F0;--ink:#14201C;--ink-muted:#566962;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Serif',Georgia,serif;
       display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:2rem;}
  .wrap{max-width:480px;}
  .logo{font-family:'IBM Plex Mono',monospace;font-size:1.1rem;color:var(--ink-muted);margin-bottom:3rem;display:block;}
  .logo span{color:var(--accent);}
  h1{font-size:clamp(3rem,10vw,5rem);color:var(--primary);line-height:1;margin-bottom:.5rem;}
  p{color:var(--ink-muted);font-size:1rem;margin:1rem 0 2.5rem;font-family:'IBM Plex Serif',serif;}
  a{display:inline-block;background:var(--primary);color:#F6F5F0;text-decoration:none;
    font-family:'IBM Plex Mono',monospace;font-size:.88rem;padding:.85em 1.6em;border-radius:2px;}
  a:hover{background:#0A2E27;}
</style>
</head>
<body>
  <div class="wrap">
    <span class="logo">DV<span>.</span></span>
    <h1>404</h1>
    <p>La pagina che cerchi non esiste o è stata spostata.</p>
    <a href="/">Torna alla home</a>
  </div>
</body>
</html>
